name: Gemini AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR တွင် Comment ပြန်ရေးရန်အတွက် မဖြစ်မနေလိုအပ်သည်

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git History အားလုံးကို ဆွဲယူရန်

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Get Git Diff
        run: |
          # Target Branch (ဥပမာ- main) ကို အရင် Fetch လုပ်ရန်
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          # Branch နှစ်ခုကြားက ကွာခြားချက်အစစ်အမှန်ကို ထုတ်ယူရန်
          git diff ${{ github.base_ref }}...HEAD > pr_diff.txt
          # Log ထဲမှာ Diff ထွက်မထွက် မျက်စိဖြင့် စစ်ဆေးနိုင်ရန် (မိမိ စိတ်ချရလျှင် ပြန်ဖျက်နိုင်သည်)
          cat pr_diff.txt

      - name: Run Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_review.py

      - name: Post Comment to PR
        uses: thollander/actions-comment-pull-request@v2
        if: hashFiles('review_result.md') != ''
        with:
          filePath: review_result.md